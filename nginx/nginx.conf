# ===================================================================
# Nginx Load Balancer Configuration for API Gateway Cluster
# ===================================================================

upstream api_gateway_cluster {
    # Distribute traffic based on least active connections
    least_conn;

    # API Gateway Replicas
    server api-gateway-1:5000 max_fails=3 fail_timeout=10s;
    server api-gateway-2:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 5000;
    server_name localhost 127.0.0.1;

    # Client IP and header forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass cookies and authentication headers transparently
    proxy_pass_header Set-Cookie;
    proxy_pass_header Cookie;

    # Health check endpoint for the load balancer itself
    location /lb-health {
        access_log off;
        return 200 "Nginx Load Balancer Healthy\n";
    }

    # Proxy all incoming traffic to the API Gateway cluster
    location / {
        proxy_pass http://api_gateway_cluster;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Diagnostic Header: reveals which replica handled the request
        add_header X-Upstream-Server $upstream_addr always;
    }
}

